services:
  nuxt-app:
    container_name: risapo-web
    build:
      dockerfile: dockerfile
      context: .
    ports:
      - "3000:3000"
    volumes:
      - type: bind
        source: .
        target: /app

      - type: volume
        target: /app/node_modules

    environment:
      - HOST=0.0.0.0
      - NODE_ENV=development

    command: sh -c "npm install && npm run dev"
    tty: true
